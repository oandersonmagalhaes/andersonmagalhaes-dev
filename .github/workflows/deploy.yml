name: Deploy

# Deploys the static export to Hostinger via FTP whenever a new tag is pushed.
# Required repository secrets:
#   FTP_SERVER   — Hostinger FTP host (e.g. ftp.yourdomain.com)
#   FTP_USERNAME — FTP username
#   FTP_PASSWORD — FTP password

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v0.1.1). Must be an existing tag."
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - name: Validate tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -uo pipefail
          echo "Requested tag: $TAG"
          tags=$(git ls-remote --tags --refs "https://github.com/${{ github.repository }}.git" \
                 | sed 's#.*refs/tags/##')
          if echo "$tags" | grep -qx "$TAG"; then
            echo "✅ Tag '$TAG' exists — proceeding."
          else
            echo "::error::Tag '$TAG' not found. Pick one of the available tags below:"
            echo "$tags" | sort -V | sed 's/^/  - /'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On manual runs, deploy the tag chosen in the input; on tag push,
          # use the pushed tag ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Show deploy target
        env:
          DEPLOY_REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "Deploying ref → $DEPLOY_REF"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Verify FTP connection & credentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          # Ensure secrets are actually set (fail fast, no waiting)
          : "${FTP_SERVER:?FTP_SERVER secret is empty}"
          : "${FTP_USERNAME:?FTP_USERNAME secret is empty}"
          : "${FTP_PASSWORD:?FTP_PASSWORD secret is empty}"
          echo "🔎 Target: $FTP_SERVER (FTPS, port 21)"

          echo "── 1/2 TCP reachability (10s budget) ──"
          if timeout 10 bash -c "exec 3<>/dev/tcp/$FTP_SERVER/21"; then
            echo "✅ Control port 21 reachable"
          else
            echo "::error::Cannot reach $FTP_SERVER:21 within 10s — control socket blocked. Hostinger commonly blocks FTP/FTPS from GitHub runner (cloud) IPs. Consider SFTP on port 65002."
            exit 1
          fi

          echo "── 2/2 FTPS login (verify user/password) ──"
          # -v prints the FTP dialogue; server responses (e.g. 230/530) are NOT masked,
          # so we can confirm whether the user authenticated. Short timeouts = fast fail.
          if curl -v --ssl-reqd --connect-timeout 10 --max-time 25 \
                  --user "$FTP_USERNAME:$FTP_PASSWORD" \
                  --list-only "ftp://$FTP_SERVER/"; then
            echo "✅ FTPS login succeeded for the configured user"
          else
            echo "::error::FTPS login/list failed — check FTP_USERNAME / FTP_PASSWORD (look for '530 Login incorrect' above)."
            exit 1
          fi

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          timeout: 60000
          local-dir: ./out/
          server-dir: ./
