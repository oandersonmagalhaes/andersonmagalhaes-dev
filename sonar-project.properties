# SonarQube scanner config — used by `sonar-scanner` against the local
# SonarQube instance started via `make sonar-up` (docker-compose.security.yml).
#
# Run with:
#   make coverage     # generates coverage/lcov.info that Sonar imports
#   make sonar-scan   # runs the scanner inside a docker container

sonar.projectKey=andersonmagalhaes-dev
sonar.projectName=andersonmagalhaes.dev
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.stories.tsx,\
  **/node_modules/**,\
  **/.next/**,\
  **/out/**,\
  **/storybook-static/**,\
  **/coverage/**

sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# SonarQube 9.9 LTS bundles a TypeScript version that does not understand
# `moduleResolution: bundler` (used by Next.js). Point it at an override
# that swaps in `node` so the TS sensor can build its program.
sonar.typescript.tsconfigPath=tsconfig.sonar.json

sonar.host.url=http://localhost:9000
